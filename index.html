<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b43">
<title>card</title>
<script>
  (function () {
    var saved = localStorage.getItem('hcz-theme');
    var theme = saved === 'light' || saved === 'dark' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --green: #0b6b43;
    --green-2: #128a57;
    --ink: #1c2b24;
    --sub: #5d6f67;
    --line: #e4eee8;
    --bg: #f3f6f4;
    --card: #fff;
    --surface: #fff;
    --input: #fff;
    --red: #d63b32;
    --orange: #a15c00;
    --shadow: 0 1px 2px rgba(16,40,28,.05), 0 10px 28px rgba(16,40,28,.05);
    --ghost: #eef6f1;
    --help: #f6fbf8;
    --coupon: #fbfefc;
    --chip-on: #e7f6ee;
    --chip-line: #b7e4cb;
    --accent-ink: #0b6b43;
    --ok-bg: #e5f6ec;
    --ok-ink: #0b7a43;
    --soon-bg: #fff4e0;
    --today-bg: #ffeceb;
    --today-ink: #c6281e;
    --expired-bg: #fde8e6;
    --wait-bg: #eef1f3;
    --wait-ink: #5c6b73;
    --banner-bg: #fdeceb;
    --banner-ink: #8d201b;
    --toast-bg: #173127;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --ink: #e8f3ed;
    --sub: #a3b8ae;
    --line: #2c4037;
    --bg: #101816;
    --card: #1b2823;
    --surface: #24332d;
    --input: #121c18;
    --red: #ff9b94;
    --orange: #f2b85c;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.35);
    --ghost: #24362e;
    --help: #15241e;
    --coupon: #15211c;
    --chip-on: #1d3b2e;
    --chip-line: #2f6a4c;
    --accent-ink: #8ee0b2;
    --ok-bg: #1a3d2c;
    --ok-ink: #8ee0b2;
    --soon-bg: #3a2d14;
    --today-bg: #3d221f;
    --today-ink: #ffb0a8;
    --expired-bg: #3d221f;
    --wait-bg: #24302c;
    --wait-ink: #c5d2cb;
    --banner-bg: #3d221f;
    --banner-ink: #ffb4ae;
    --toast-bg: #0c1411;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 16px 16px 48px; }
  .top {
    background: #000;
    color: #fff;
    border-radius: 18px;
    padding: 16px 16px 14px;
    box-shadow: var(--shadow);
  }
  .top-row { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.16);
    display: grid; place-items: center; font-weight: 700; flex: none;
  }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .brand p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
  .top-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; min-width: 0; }
  .top-search {
    width: 240px; max-width: 100%; border: 0; border-radius: 999px; padding: 8px 14px;
    background: rgba(255,255,255,.16); color: #fff; outline: none;
  }
  .top-search::placeholder { color: rgba(255,255,255,.72); }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .nav button, .btn {
    border: 0; border-radius: 999px; padding: 8px 14px; background: var(--surface); color: var(--accent-ink);
    font-weight: 650;
  }
  .nav button { background: rgba(255,255,255,.16); color: #fff; }
  .nav button.on { background: #fff; color: var(--green); }
  .btn.primary { background: var(--green); color: #fff; }
  .btn.ghost { background: var(--ghost); color: var(--accent-ink); }
  .btn.danger { background: var(--expired-bg); color: var(--red); }
  .btn.small { padding: 6px 10px; font-size: 13px; font-weight: 600; }
  .btn.block { width: 100%; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stat {
    text-align: left; background: rgba(255,255,255,.14); color: #fff; border-radius: 14px;
    padding: 10px 12px; border: 0; font: inherit;
  }
  .stat b { display: block; font-size: 26px; line-height: 1.1; }
  .stat span { font-size: 12px; opacity: .9; }
  .stat em { font-style: normal; display: block; font-size: 11px; opacity: .75; }
  .stat.on { background: #fff; color: var(--green); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; }
  .chip, .filters button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px;
    white-space: nowrap; color: var(--sub);
  }
  .chip.on, .filters button.on { background: var(--chip-on); color: var(--accent-ink); border-color: var(--chip-line); font-weight: 700; }
  .toolbar { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin: 8px 0 12px; flex-wrap: wrap; }
  .toolbar input[type="search"] {
    flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--input); color: var(--ink);
  }
  .filters { display: none; }
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--sub); font-weight: 650; }
  tr:last-child td { border-bottom: 0; }
  .name-btn { background: none; border: 0; padding: 0; font-weight: 700; color: var(--ink); text-align: left; word-break: break-word; }
  .g-id { display: none; }
  td { word-break: break-word; }
  .muted { color: var(--sub); font-size: 13px; }
  .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .pill.soon { background: var(--soon-bg); color: var(--orange); }
  .pill.today { background: var(--today-bg); color: var(--today-ink); }
  .pill.expired { background: var(--expired-bg); color: var(--red); }
  .pill.wait, .pill.used, .pill.usedup { background: var(--wait-bg); color: var(--wait-ink); }
  .ops { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { padding: 36px 16px; text-align: center; }
  .empty h2 { margin: 0 0 6px; font-size: 18px; }
  .m-list { display: flex; flex-direction: column; gap: 10px; }
  .policy { padding: 16px 18px; }
  .policy-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .policy .name-btn { font-size: 16px; }
  .policy .sum, .policy .policy-meta { margin: 6px 0 0; }
  .policy .price-line { margin-top: 12px; }
  .policy .ops { margin-top: 12px; justify-content: flex-end; }
  @media (min-width: 861px) {
    .wrap { max-width: 1200px; }
    .chips { flex-wrap: wrap; overflow: visible; }
    .policy {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 46%);
      column-gap: 20px;
      row-gap: 6px;
      align-items: center;
    }
    .policy-top { grid-column: 1; grid-row: 1; }
    .policy .sum { grid-column: 1; grid-row: 2; margin: 0; }
    .policy .policy-meta { grid-column: 1; grid-row: 3; margin: 0; }
    .policy .price-line { grid-column: 2; grid-row: 1 / span 2; margin: 0; align-self: center; }
    .policy .ops { grid-column: 2; grid-row: 3; margin: 0; }
  }
  .section { margin-top: 14px; }
  .section h2 { font-size: 16px; margin: 0 0 8px; }
  .gift {
    padding: 14px; border-top: 1px solid var(--line);
  }
  .gift:first-child { border-top: 0; }
  .gift-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .kv { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--sub); }
  .field input, .field select, .field textarea, .inline input, .inline select, textarea.code {
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--input); color: var(--ink); width: 100%;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .gift-edit { display: grid; grid-template-columns: minmax(140px, 1.6fr) 84px 84px 108px auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .gift-edit-head { color: var(--sub); font-size: 12px; margin-bottom: 0; }
  .card.only-d { overflow-x: auto; }
  .money-card { margin-top: 12px; padding: 12px 14px; }
  .money-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .money-head .btn { flex: none; }
  .money-label { font-size: 13px; font-weight: 700; color: var(--sub); }
  .money, .price-line { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .money { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .money div, .price-line span { background: var(--help); border-radius: 12px; padding: 8px 10px; }
  .money b, .price-line b { display: block; font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .money span, .price-line em { display: block; font-style: normal; font-size: 12px; color: var(--sub); }
  .money .down b, .price-line .down b, td.down { color: var(--red); }
  .help { background: var(--help); border-radius: 12px; padding: 10px 12px; color: var(--sub); font-size: 13px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; width: auto; background: var(--help); border-radius: 999px; padding: 6px 12px; color: var(--ink); }
  .checks input { width: auto; }
  .acc-row { display: inline-flex; align-items: center; gap: 8px; background: var(--help); border-radius: 999px; padding: 4px 10px 4px 12px; color: var(--ink); }
  .checks .acc-row label { background: none; padding: 0; border-radius: 0; }
  .acc-row .acc-copies { width: 64px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--input); color: var(--ink); }
  .acc-row .acc-copies:disabled { opacity: .4; }
  .acc-head { margin: 16px 0 0; font-size: 15px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline input { flex: 1; min-width: 0; width: auto; }
  .inline .btn { flex: none; white-space: nowrap; }
  .gift-edit input {
    width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; background: var(--input); color: var(--ink);
  }
  .catalog { background: var(--help); border-radius: 12px; padding: 8px 12px; }
  .catalog summary { cursor: pointer; font-weight: 700; color: var(--ink); }
  .catalog .tpl-box { margin-top: 8px; }
  .tpl-box { display: flex; flex-direction: column; gap: 8px; }
  .tpl {
    display: block; width: 100%; text-align: left; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 12px; font-weight: 650;
  }
  .tpl small { display: block; margin-top: 2px; font-weight: 500; color: var(--sub); font-size: 12px; }
  .tpl:hover { border-color: var(--chip-line); background: var(--chip-on); }
  .back { background: none; border: 0; color: var(--accent-ink); font-weight: 700; padding: 0 0 8px; }
  .page-title { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .page-title h2 { margin: 0; font-size: 22px; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .blocks { display: none; }
  .coupon {
    border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 8px; background: var(--coupon);
  }
  .coupon .row { display: flex; justify-content: space-between; gap: 8px; }
  .warn { color: var(--red); font-size: 13px; }
  .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pad { padding: 16px; }
  textarea.code { min-height: 120px; }
  .preview { overflow: auto; max-height: 240px; border: 1px solid var(--line); border-radius: 12px; }
  .preview table { min-width: 640px; }
  .modal { position: fixed; inset: 0; z-index: 40; }
  .modal[hidden] { display: none !important; }
  .mask { position: absolute; inset: 0; background: rgba(12, 28, 22, .45); }
  .dialog {
    position: relative; z-index: 1; width: min(760px, calc(100% - 24px)); max-height: min(88vh, 860px);
    overflow: auto; margin: 6vh auto; background: var(--card); color: var(--ink); border-radius: 18px; padding: 18px; box-shadow: var(--shadow);
  }
  .dialog h3 { margin: 0 0 6px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--toast-bg); color: #fff; padding: 10px 16px; border-radius: 999px; z-index: 50;
    max-width: calc(100% - 24px);
  }
  #toast[hidden] { display: none; }
  .banner { background: var(--banner-bg); color: var(--banner-ink); padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; }
  @media (max-width: 860px) {
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); overflow: visible; }
    .stat { min-width: 0; }
    .stat b { font-size: 22px; }
    .only-d { display: none !important; }
    .blocks { display: block; }
    .policy { display: block; }
    .grid-2, .data-grid, .gift-edit { grid-template-columns: 1fr; }
    .gift-edit-head { display: none; }
    .price-line { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .top-row { flex-direction: column; }
    .top-side { align-items: stretch; width: 100%; }
    .top-search { width: 100%; }
    .nav { justify-content: flex-start; }
    .dialog { width: 100%; max-height: 100%; height: 100%; margin: 0; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal" class="modal" hidden>
  <div class="mask" data-act="modal-cancel"></div>
  <div class="dialog">
    <h3 id="modalTitle"></h3>
    <p id="modalText" class="muted"></p>
    <div id="modalBody"></div>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="modalCancel">取消</button>
      <button type="button" class="btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<input id="file" type="file" accept=".xlsx,.csv,.txt,.json,application/json" hidden>
<script>
(function () {
  const KEY = 'hcz-cards-v1';
  const STATUS = {
    ok: ['可用中', 'ok'], usable: ['可用', 'ok'], soon: ['临期', 'soon'], today: ['今天到期', 'today'],
    expired: ['已过期', 'expired'], wait: ['未发放', 'wait'], used: ['已使用', 'used'],
    usedup: ['已用完', 'usedup'], empty: ['未填写', 'wait']
  };
  let seq = 1;
  let state = null;
  let editDraft = null;
  let ui = { filter: 'all', q: '' };
  let syncHandle = null;
  let syncStatus = '未绑定同步文件';
  let cloudStatus = '未开启云端同步';
  let modalCb = null;
  let toastTimer = 0;
  let testErrs = [];
  let scrollHome = false;

  function uid(prefix) {
    seq += 1;
    return prefix + Date.now().toString(36) + seq.toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return null;
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }
  function fmtDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function todayStr() { return fmtDate(new Date()); }
  function addMonths(s, n) {
    const d = parseDate(s);
    if (!d || (!n && n !== 0)) return '';
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return fmtDate(d);
  }
  function addDays(s, n) {
    const d = parseDate(s);
    if (!d) return '';
    d.setDate(d.getDate() + n);
    return fmtDate(d);
  }
  function daysBetween(from, to) {
    const a = parseDate(from), b = parseDate(to);
    if (!a || !b) return null;
    return Math.round((b - a) / 86400000);
  }
  function daysLeft(exp, today) {
    if (!exp) return null;
    return daysBetween(today || todayStr(), exp);
  }
  function normalizeDate(s) {
    if (s == null) return '';
    s = String(s).trim();
    if (!s) return '';
    if (/^\d+(\.\d+)?$/.test(s)) {
      const n = Math.round(Number(s));
      if (n > 20000 && n < 80000) {
        const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
        return d.toISOString().slice(0, 10);
      }
    }
    s = s.replace('T', ' ').trim().replace(/\s+.*/, '');
    s = s.replace(/[./]/g, '-').replace(/年/g, '-').replace(/月/g, '-').replace(/日/g, '');
    s = s.replace(/-+/g, '-').replace(/^-|-$/g, '');
    const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!m) return '';
    const y = Number(m[1]), mo = Number(m[2]), da = Number(m[3]);
    const d = new Date(y, mo - 1, da);
    if (d.getFullYear() !== y || d.getMonth() !== mo - 1 || d.getDate() !== da) return '';
    return fmtDate(d);
  }
  function roundMoney(n) {
    const x = Number(n);
    if (!Number.isFinite(x)) return 0;
    return Math.round(x * 100) / 100;
  }
  function moneyNum(v) {
    const n = typeof v === 'number' ? v : parseFloat(String(v == null ? '' : v).replace(/[¥,\s]/g, ''));
    if (!Number.isFinite(n) || n < 0) return 0;
    return roundMoney(n);
  }
  function yuan(n) {
    const x = roundMoney(n);
    return (x < 0 ? '-' : '') + '¥' + Math.abs(x).toFixed(2);
  }
  function monthStep(gift) {
    const n = gift && gift.perMonth | 0;
    return n > 0 ? n : 1;
  }
  function copiesOf(project, accountId) {
    if (!project) return 1;
    const map = project.accountCopies;
    if (accountId && map && (map[accountId] | 0) > 0) return map[accountId] | 0;
    const n = project.copies | 0;
    return n > 0 ? n : 1;
  }
  function scopeAccountIds(project) {
    const ids = accountIdsOf(project);
    if (!ids.length) return [];
    if (state && state.currentAccountId && state.currentAccountId !== 'all' && ids.indexOf(state.currentAccountId) >= 0) return [state.currentAccountId];
    return ids;
  }
  function scopedCopyCount(project) {
    const ids = scopeAccountIds(project);
    if (!ids.length) return copiesOf(project);
    let n = 0;
    ids.forEach(function (id) { n += copiesOf(project, id); });
    return n || 1;
  }
  function viewOf(project, accountId) {
    return { validMonths: project.validMonths, copies: copiesOf(project, accountId), firstIssue: project.firstIssue, cost: project.cost, cash: project.cash };
  }
  function ensureHolder(gift, accountId, seedFromGift) {
    gift.holders = gift.holders || {};
    if (!gift.holders[accountId]) {
      gift.holders[accountId] = seedFromGift
        ? { used: gift.used | 0, anchor: gift.anchor || '', log: gift.log || [], issueOv: gift.issueOv || {}, expireOv: gift.expireOv || {} }
        : { used: 0, anchor: gift.anchor || '', log: [], issueOv: {}, expireOv: {} };
    }
    const h = gift.holders[accountId];
    h.log = Array.isArray(h.log) ? h.log : [];
    h.issueOv = h.issueOv || {};
    h.expireOv = h.expireOv || {};
    h.qty = gift.qty;
    h.perMonth = gift.perMonth;
    h.price = gift.price;
    h.name = gift.name;
    return h;
  }
  function slotOf(gift, accountId) {
    if (accountId && gift.holders && gift.holders[accountId]) return gift.holders[accountId];
    return gift;
  }
  function mirrorPrimary(project, gift) {
    const id = accountIdsOf(project)[0];
    if (!id || !gift.holders || !gift.holders[id]) return gift;
    const h = gift.holders[id];
    gift.used = h.used | 0;
    gift.anchor = h.anchor || '';
    gift.log = h.log || [];
    gift.issueOv = h.issueOv || {};
    gift.expireOv = h.expireOv || {};
    return gift;
  }
  function trimSlot(slot, total) {

  const CLOUD_KEY = 'hcz-cloud-v1';
  function cloudCfg() {

  function b64url(bytes) {
    let s = '';
    const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');

  function b64urlDecode(s) {
    s = String(s || '').replace(/-/g, '+').replace(/_/g, '/');

    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function parseSyncCode(text) {
    const s = String(text || '').trim();
    if (s.indexOf('hcz1.') !== 0) throw new Error('同步码不对');
    const o = JSON.parse(new TextDecoder().decode(b64urlDecode(s.slice(5))));
    if (!o || !o.id || !o.token) throw new Error('同步码不完整');
    return { id: String(o.id), token: String(o.token) };
  }

    if (rt > lt) return 'pull';
    if (lt > rt) return 'push';
    return 'same';
  }

    const res = await fetch('https://api.github.com' + path, {

      headers: headers,
      body: body ? JSON.stringify(body) : undefined
    });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (err) { data = { message: text.slice(0, 180) }; }

    return data;

  async function fetchRemote(cfg) {
    const gist = await ghFetch(cfg.token, '/gists/' + encodeURIComponent(cfg.id), 'GET');
    const file = gist.files && gist.files['hcz.json'];
    if (!file) throw new Error('云端备份里没有 hcz.json');
    let text = file.content || '';
    if (file.truncated && file.raw_url) {
      const res = await fetch(file.raw_url, { headers: { Authorization: 'Bearer ' + cfg.token } });
      if (!res.ok) throw new Error('云端备份读取不完整');
      text = await res.text();
    }
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.projects) || !Array.isArray(data.accounts)) throw new Error('云端内容不是卡券备份');
    return data;
  }
  async function pushCloud(cfg) {
    cfg = cfg || cloudCfg();
    if (!cfg) return;
    await ghFetch(cfg.token, '/gists/' + encodeURIComponent(cfg.id), 'PATCH', {
      files: { 'hcz.json': { content: JSON.stringify(state) } }
    });
    setCloudStatus('已上传 ' + (state.updatedAt || ''));
  }
  function adoptCloud(data) {
    state = data;
    normalize(state);
    ensure();
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('浏览器无法保存云端数据'); }
  }
  async function reconcileCloud() {
    const cfg = cloudCfg();
    if (!cfg) return 'off';
    const remote = await fetchRemote(cfg);
    const action = pickCloud(state, remote, !!localStorage.getItem(KEY));
    if (action === 'pull') {
      adoptCloud(remote);
      render();
      setCloudStatus('已采用云端较新数据');
      return 'pull';
    }
    if (action === 'push') {
      await pushCloud(cfg);
      return 'push';
    }
    setCloudStatus('云端已是最新');
    return 'same';
  }
  async function enableCloud(token) {
    token = String(token || '').trim();
    if (!token) { toast('请粘贴 GitHub 令牌'); return; }
    setCloudStatus('正在上传');
    const gist = await ghFetch(token, '/gists', 'POST', {
      description: '好车主卡券',
      public: false,
      files: { 'hcz.json': { content: JSON.stringify(state) } }
    });
    if (!gist || !gist.id) throw new Error('没有拿到云端编号');
    saveCloudCfg({ id: gist.id, token: token });
    setCloudStatus('已上传 ' + (state.updatedAt || ''));
    render();
    const code = packSyncCode(cloudCfg());
    await openModal({
      title: '同步码',
      text: '复制到其他设备的「填入同步码」。里面有访问令牌，不要发给别人。',
      html: '<textarea class="code" id="cloud-code" readonly>' + esc(code) + '</textarea>',
      okText: '复制',
      hideCancel: true
    });
    try { await navigator.clipboard.writeText(code); toast('已复制同步码'); }
    catch (e) { toast('请手动复制同步码'); }
  }
  async function useCloudCode(raw) {
    const cfg = parseSyncCode(raw);
    const remote = await fetchRemote(cfg);
    let action = pickCloud(state, remote, !!localStorage.getItem(KEY));
    if (action === 'push' && state.projects.length && remote.projects.length) {
      const ans = await openModal({
        title: '两边都有数据',
        text: '本机保存时间比云端新。',
        html: '<label><input type="radio" name="mode" value="pull" checked> 用云端覆盖本机</label><br><label><input type="radio" name="mode" value="push"> 用本机覆盖云端</label>',
        okText: '继续'
      });
      if (!ans) return;
      action = ans.mode || 'pull';
    }
    saveCloudCfg(cfg);
    if (action === 'pull') {
      adoptCloud(remote);
      render();
      setCloudStatus('已采用云端数据');
      toast('已从云端取回');
      return;
    }
    if (action === 'push') {
      await pushCloud(cfg);
      render();
      toast('已把本机数据上传');
      return;
    }
    render();
    setCloudStatus('云端已是最新');
    toast('已绑定云端');
  }

  let syncTimer = 0;
  let cloudTask = Promise.resolve();
  function scheduleSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      writeSyncFile().catch(function () {});
      if (!cloudCfg()) return;
      cloudTask = cloudTask.then(function () { return pushCloud(); }).catch(function (e) {
        setCloudStatus(cloudErr(e));
        toast(cloudStatus);
      });
    }, 500);
  }
  function idbStore(mode) {
    return new Promise(function (resolve, reject) {
      const req = indexedDB.open('hcz-cards', 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
      req.onerror = function () { reject(req.error); };
      req.onsuccess = function () { resolve(req.result.transaction('kv', mode).objectStore('kv')); };
    });
  }
  async function idbGet(key) {
    const store = await idbStore('readonly');
    return new Promise(function (resolve, reject) {
      const r = store.get(key);
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }
  async function idbSet(key, value) {
    const store = await idbStore('readwrite');
    return new Promise(function (resolve, reject) {
      const r = store.put(value, key);
      r.onsuccess = function () { resolve(); };
      r.onerror = function () { reject(r.error); };
    });
  }
  async function writeSyncFile() {
    if (!syncHandle) return;
    const writable = await syncHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
    syncStatus = '已写入同步文件 ' + (state.updatedAt || '');
  }
  async function reconcileSync() {
    if (!syncHandle) return;
    const file = await syncHandle.getFile();
    const text = await file.text();
    if (!text.trim()) { await writeSyncFile(); syncStatus = '同步文件是空的，已写入本机数据'; return; }
    const data = JSON.parse(text);
    const ft = data.updatedAt || '';
    const lt = state.updatedAt || '';
    if (ft > lt) {
      state = data;
      normalize(state);
      ensure();
      localStorage.setItem(KEY, JSON.stringify(state));
      syncStatus = '已采用同步文件中较新的数据';
    } else if (lt > ft) {
      await writeSyncFile();
      syncStatus = '已把本机较新数据写入同步文件';
    } else syncStatus = '同步文件已是最新';
  }
  async function bindSync(saveAs) {
    try {
      if (saveAs) {
        if (!window.showSaveFilePicker) { toast('这个浏览器不能绑定本地文件，请改用下载 JSON'); return; }
        syncHandle = await window.showSaveFilePicker({ suggestedName: '好车主卡券.json', types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
      } else {
        if (!window.showOpenFilePicker) { toast('这个浏览器不能绑定本地文件，请改用下载 JSON'); return; }
        const handles = await window.showOpenFilePicker({ multiple: false, types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
        syncHandle = handles[0];
      }
      await idbSet('handle', syncHandle);
      if (saveAs) { await writeSyncFile(); syncStatus = '已绑定新的同步文件'; }
      else await reconcileSync();
      render();
      toast(syncStatus);
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      toast(err.message || '没能绑定同步文件');
    }
  }
  async function initSync() {
    try { syncHandle = await idbGet('handle'); } catch (e) { syncHandle = null; }
    if (!syncHandle) return;
    try {
      const perm = await syncHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') { syncStatus = '同步文件需要重新授权，请到数据页点「立即对齐」'; render(); return; }
      await reconcileSync();
      render();
    } catch (e) {
      syncStatus = '读同步文件失败，本机数据仍在';
      render();
    }
  }

  function selfTest() {
    const errs = [];
    function eq(a, b, m) { if (a !== b) errs.push(m + ' => ' + JSON.stringify(a)); }
    eq(addMonths('2026-01-15', 1), '2026-02-15', 'm1');
    eq(addMonths('2026-01-31', 1), '2026-02-28', 'm2');
    eq(addMonths('2024-01-31', 1), '2024-02-29', 'leap');
    eq(addDays(addMonths('2026-01-15', 1), -1), '2026-02-14', 'exp');
    const g = blankGift('券', 4, 0, '2026-01-15');
    eq(issueOf(g, 1), '2026-01-15', 'i1');
    eq(issueOf(g, 3), '2026-03-15', 'i3');
    eq(expireOf({ validMonths: 1 }, g, 1), '2026-02-14', 'e1');
    eq(expireOf({ validMonths: 12 }, g, 1), '2026-02-14', 'e1-month');
    eq(cardStatus({ validMonths: 12 }, blankGift('券', 2, 0, '2026-10-11', 1, 10), 1, '2026-11-27'), 'expired', 'past-month');
    eq(remainCash({ validMonths: 12 }, blankGift('券', 2, 0, '2026-10-11', 1, 10), '2026-11-27'), 10, 'remain-open');
    eq(profitRateLabel(100, 135), '(润:35%)', 'rate');
    eq(profitRateLabel(380, 576), '(润:52%)', 'rate-round');
    eq(profitRateLabel(100, 80), '(润:-20%)', 'rate-down');
    eq(profitRateLabel(0, 50), '(润:—)', 'rate-zero');
    const packed = packSyncCode({ id: 'gid', token: 'tok+en/=' });
    const unpacked = parseSyncCode(packed);
    eq(unpacked.id, 'gid', 'cloud-id');
    eq(unpacked.token, 'tok+en/=', 'cloud-token');
    eq(pickCloud({ updatedAt: '2026-01-01T00:00:00.000Z' }, { updatedAt: '2026-02-01T00:00:00.000Z', projects: [{}] }, true), 'pull', 'cloud-pull');
    eq(pickCloud({ updatedAt: '2026-03-01T00:00:00.000Z' }, { updatedAt: '2026-02-01T00:00:00.000Z', projects: [{}] }, true), 'push', 'cloud-push');
    eq(pickCloud({ updatedAt: '2026-03-01T00:00:00.000Z' }, { updatedAt: '2026-02-01T00:00:00.000Z', projects: [{}] }, false), 'pull', 'cloud-fresh');
    g.expireOv['1'] = '2026-03-01';
    eq(expireOf({ validMonths: 1 }, g, 1), '2026-03-01', 'eov');
    delete g.expireOv['1'];
    g.issueOv['2'] = '2026-02-20';
    eq(issueOf(g, 2), '2026-02-20', 'iov');
    eq(expireOf({ validMonths: 1 }, g, 2), '2026-03-19', 'e2');
    const g2 = blankGift('券', 12, 0, '2020-01-15');
    useCurrent(g2, '2026-11-26');
    eq(g2.used, 1, 'used');
    eq(g2.anchor, '2026-11-26', 'jump');
    eq(issueOf(g2, 2), '2026-11-26', 'next');
    eq(g2.log[0].issue, '2020-01-15', 'log');
    undoLast(g2);
    eq(g2.used, 0, 'undo');
    eq(g2.anchor, '2020-01-15', 'undo-a');
    const g3 = blankGift('券', 3, 0, '2026-01-15');
    useCurrent(g3, '2026-01-20');
    eq(g3.anchor, '2026-02-15', 'ontime');
    eq(cardStatus({ validMonths: 1 }, blankGift('券', 2, 0, '2026-10-27'), 1, '2026-11-26'), 'today', 'today');
    eq(cardStatus({ validMonths: 1 }, blankGift('券', 2, 0, '2026-10-30'), 1, '2026-11-26'), 'soon', 'soon');
    eq(cardStatus({ validMonths: 1 }, blankGift('券', 2, 0, '2026-08-01'), 1, '2026-11-26'), 'expired', 'expired');
    eq(cardStatus({ validMonths: 1 }, blankGift('券', 2, 0, '2026-11-27'), 1, '2026-11-26'), 'wait', 'wait');
    const gm = blankGift('券', 4, 0, '2026-01-15', 2, 10);
    eq(issueOf(gm, 1), '2026-01-15', 'pm1');
    eq(issueOf(gm, 2), '2026-01-15', 'pm2');
    eq(issueOf(gm, 3), '2026-02-15', 'pm3');
    useCurrent(gm, '2026-01-20');
    eq(gm.anchor, '2026-01-15', 'pm-hold');
    eq(issueOf(gm, 2), '2026-01-15', 'pm-hold-2');
    eq(issueOf(gm, 3), '2026-02-15', 'pm-hold-3');
    useCurrent(gm, '2026-01-20');
    eq(gm.anchor, '2026-02-15', 'pm-next');
    const cashable = { validMonths: 1 };
    const g4 = blankGift('券', 3, 0, '2026-11-26', 1, 10);
    eq(remainCount(cashable, g4, '2026-11-26'), 3, 'rem3');
    useCurrent(g4, '2026-11-26');
    eq(remainCount(cashable, g4, '2026-11-26'), 2, 'rem2');
    eq(remainCash(cashable, g4, '2026-11-26'), 20, 'cash20');
    const g5 = blankGift('券', 1, 0, '2026-01-01', 1, 8);
    eq(remainCount({ validMonths: 1 }, g5, '2026-11-26'), 0, 'rem0');
    eq(projectMoney({ cost: 30, cash: 80, series: [g4] }, '2026-11-26').profit, 50, 'profit');
    eq(projectMoney({ cost: 30, cash: 80, copies: 3, series: [] }).profit, 150, 'profit-x');
    eq(projectMoney({ cost: 30, cash: 80, copies: 3, series: [] }).spent, 90, 'spent-x');
    const split = { validMonths: 1, copies: 2, cost: 30, cash: 80, accountIds: ['a', 'b'], accountCopies: { a: 2, b: 1 }, series: [] };
    const gsplit = blankGift('券', 2, 0, '2026-01-15', 1, 0);
    split.series = [gsplit];
    trimGift(split, gsplit);
    eq(actualQty(split, gsplit, 'a'), 4, 'copy-a');
    eq(actualQty(split, gsplit, 'b'), 2, 'copy-b');
    useCurrent(gsplit.holders.a, '2026-01-20', viewOf(split, 'a'));
    eq(gsplit.holders.a.used, 1, 'used-a');
    eq(gsplit.holders.b.used, 0, 'used-b');
    eq(projectMoney(split, '2026-01-20', true).profit, 150, 'profit-accounts');
    eq(projectMoney(split, '2026-01-20', true).spent, 90, 'spent-accounts');
    eq(projectMoney({ cost: 30, cash: 80, series: [g4] }, '2026-11-26').remain, 20, 'remain');
    const pack = { validMonths: 1, copies: 3 };
    const multi = blankGift('券', 4, 0, '2026-01-15', 1, 10);
    eq(actualQty(pack, multi), 12, 'aq');
    eq(actualStep(pack, multi), 3, 'as');
    eq(issueOf(multi, 1, pack), '2026-01-15', 'mq1');
    eq(issueOf(multi, 3, pack), '2026-01-15', 'mq3');
    eq(issueOf(multi, 4, pack), '2026-02-15', 'mq4');
    useCurrent(multi, '2026-01-20', pack);
    useCurrent(multi, '2026-01-20', pack);
    eq(multi.anchor, '2026-01-15', 'mq-hold');
    useCurrent(multi, '2026-01-20', pack);
    eq(multi.anchor, '2026-02-15', 'mq-next');
    eq(remainCount(pack, multi, '2026-01-20'), 9, 'mq-rem');
    const matrix = [
      ['账号', '名称', '礼包1', '礼包数量', '礼包1已用', '礼包1当前发放', '礼包2', '礼包数量', '礼包2已用', '礼包2当前发放', '首次发放时间', '有效期月', '备注'],
      ['我的好车主', '平安行', '100-20话费券', '12', '2', '2026-03-15', '药诊卡', '1', '0', '', '2026-01-15', '1', '测试']
    ];
    const parsed = parseTable(matrix);
    eq(parsed.kind, 'policy', 'kind');
    eq(parsed.records[0].gifts.length, 2, 'gifts');
    eq(parsed.records[0].gifts[0].used, 2, 'u');
    eq(parsed.records[0].gifts[0].anchor, '2026-03-15', 'anchor');
    eq(parsed.records[0].gifts[1].anchor, '2026-01-15', 'anchor2');
    eq(normalizeDate('2026年1月5日'), '2026-01-05', 'cn');
    eq(normalizeDate('2026/1/5'), '2026-01-05', 'slash');
    const serial = String(Math.round((Date.UTC(2026, 0, 15) - Date.UTC(1899, 11, 30)) / 86400000));
    eq(normalizeDate(serial), '2026-01-15', 'serial');
    const rows = buildPolicyRows([{
      accountId: 'a1', name: '平安行', note: 'n', firstIssue: '2026-01-15', validMonths: 1, cost: 50, cash: 80,
      series: [blankGift('话费券', 12, 2, '2026-03-15', 2, 15), blankGift('药诊卡', 1, 0, '2026-01-15', 1, 9)]
    }], [{ id: 'a1', name: '我的好车主' }]);
    const back = parseTable(rows);
    eq(back.records[0].gifts[0].used, 2, 'rt');
    eq(back.records[0].gifts[1].name, '药诊卡', 'rt2');
    eq(back.records[0].cost, 50, 'cost');
    eq(back.records[0].cash, 80, 'cash');
    eq(back.records[0].gifts[0].perMonth, 2, 'pm-imp');
    eq(back.records[0].gifts[0].price, 15, 'price');
    eq(back.records[0].gifts[1].price, 9, 'price2');
    return errs;
  }

  window.HCZ = { addMonths: addMonths, expireOf: expireOf, issueOf: issueOf, cardStatus: cardStatus, parseTable: parseTable, buildPolicyRows: buildPolicyRows, buildDetailRows: buildDetailRows, sheetXml: sheetXml, parseSheetXml: parseSheetXml, makeXlsx: makeXlsx, readXlsxAll: readXlsxAll, state: function () { return state; } };
  async function initCloud() {
    if (!cloudCfg()) return;
    try { await reconcileCloud(); }
    catch (e) { setCloudStatus(cloudErr(e)); render(); }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !cloudCfg()) return;
    if (location.hash.indexOf('#/edit/') === 0) return;
    reconcileCloud().catch(function (e) { setCloudStatus(cloudErr(e)); });
  });

  load();
  if (cloudCfg()) cloudStatus = '正在读取云端';
  testErrs = selfTest();
  window.HCZ.errors = testErrs;
  if (testErrs.length) console.error(testErrs);
  window.addEventListener('hashchange', render);
  render();
  initSync();
  initCloud();
})();
